name: Build Wasal Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure release signing keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android -alias androiddebugkey -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Gradle configuration check
        run: ./gradlew :app:tasks --all -q > /dev/null && echo "configuration ok"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APKs with version
        run: |
          mkdir -p out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$DEBUG_APK" "out/wasal-${VERSION}-debug.apk"
          cp "$RELEASE_APK" "out/wasal-${VERSION}-release.apk"
          ls -l out

      - name: Verify APK output
        run: |
          ls -l app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasal-debug-apk
          path: out/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasal-release-apk
          path: out/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasal-build-reports
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: warn
          retention-days: 7
